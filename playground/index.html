<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exploring Angular Templates — Interactive Tour</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-hover: #242836;
      --border: #2e3345;
      --text: #e4e7ef;
      --text-muted: #8b90a0;
      --accent: #7c6ef6;
      --accent-glow: rgba(124, 110, 246, 0.15);
      --success: #4ade80;
      --error: #f87171;
      --code-bg: #161b22;
      --nav-width: 280px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      overflow: hidden;
      height: 100vh;
    }

    /* Layout */
    .app {
      display: flex;
      height: 100vh;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: var(--nav-width);
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 2rem 0;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar h1 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      padding: 0 1.5rem;
      margin-bottom: 1.5rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 1.5rem;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 0.9rem;
      color: var(--text-muted);
      border-left: 3px solid transparent;
    }

    .nav-item:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .nav-item.active {
      background: var(--accent-glow);
      color: var(--accent);
      border-left-color: var(--accent);
    }

    .nav-item .num {
      font-size: 0.75rem;
      font-weight: 600;
      width: 1.5rem;
      height: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--border);
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .nav-item.active .num {
      background: var(--accent);
      color: white;
    }

    /* Main Content */
    .main {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .section {
      display: none;
      padding: 3rem 4rem;
      max-width: 900px;
      animation: fadeIn 0.3s ease;
    }

    .section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section h2 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }

    .section p, .section li {
      color: var(--text-muted);
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }

    .section ul {
      list-style: none;
      padding-left: 0;
    }

    .section li::before {
      content: "→ ";
      color: var(--accent);
    }

    .section h3 {
      font-size: 1.2rem;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      color: var(--text);
    }

    /* Code Blocks */
    .code-block {
      position: relative;
      margin: 1.5rem 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .code-block .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.5rem 1rem;
      background: var(--border);
      color: var(--text-muted);
    }

    .code-block pre {
      margin: 0;
      padding: 1.25rem;
      overflow-x: auto;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .code-block code {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }

    /* Annotations */
    .annotation {
      background: var(--accent-glow);
      border-left: 3px solid var(--accent);
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
    }

    .annotation strong {
      color: var(--accent);
    }

    /* Comparison table */
    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .compare .code-block {
      margin: 0;
    }

    /* Quiz */
    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      margin: 1.5rem 0;
    }

    .quiz-card .question {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: var(--text);
    }

    .quiz-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .quiz-btn {
      padding: 0.6rem 1.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-hover);
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.15s;
    }

    .quiz-btn:hover {
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .quiz-btn.correct {
      border-color: var(--success);
      background: rgba(74, 222, 128, 0.1);
      color: var(--success);
    }

    .quiz-btn.wrong {
      border-color: var(--error);
      background: rgba(248, 113, 113, 0.1);
      color: var(--error);
    }

    .quiz-explanation {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .quiz-explanation.show {
      display: block;
    }

    .quiz-explanation.correct {
      background: rgba(74, 222, 128, 0.08);
      border: 1px solid rgba(74, 222, 128, 0.3);
      color: var(--success);
    }

    .quiz-explanation.wrong {
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: var(--error);
    }

    .quiz-score {
      text-align: center;
      font-size: 1.5rem;
      padding: 2rem;
      color: var(--accent);
    }

    .quiz-next {
      display: none;
      margin-top: 1rem;
    }

    .quiz-next.show {
      display: block;
    }

    /* Progress bar */
    .progress {
      position: fixed;
      top: 0;
      left: var(--nav-width);
      right: 0;
      height: 3px;
      background: var(--border);
      z-index: 100;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      transition: width 0.3s ease;
    }

    /* Nav controls */
    .nav-controls {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      gap: 0.5rem;
    }

    .nav-btn {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.15s;
    }

    .nav-btn:hover {
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .section { padding: 2rem 1.5rem; }
      .progress { left: 0; }
      .compare { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <nav class="sidebar">
      <h1>Exploration</h1>
      <div id="nav-list"></div>
    </nav>

    <!-- Progress -->
    <div class="progress">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- Main content (sections injected by JS) -->
    <main class="main" id="main-content"></main>

    <!-- Navigation arrows -->
    <div class="nav-controls">
      <button class="nav-btn" id="prev-btn">←</button>
      <button class="nav-btn" id="next-btn">→</button>
    </div>
  </div>

  <script type="module" src="dist/main.js"></script>
</body>
</html>
